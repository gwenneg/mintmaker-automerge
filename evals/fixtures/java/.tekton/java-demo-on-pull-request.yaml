apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: java-demo-on-pull-request
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "main"
    build.appstudio.openshift.io/repo: https://github.com/example/java-demo?rev={{revision}}
  labels:
    appstudio.openshift.io/application: java-demo
    appstudio.openshift.io/component: java-demo
    pipelines.appstudio.openshift.io/type: build
spec:
  params:
    - name: git-url
      value: "{{source_url}}"
    - name: revision
      value: "{{revision}}"
    - name: output-image
      value: quay.io/redhat-user-workloads/example-tenant/java-demo:on-pr-{{revision}}
    - name: dockerfile
      value: Containerfile
  pipelineRef:
    name: docker-build-oci-ta
